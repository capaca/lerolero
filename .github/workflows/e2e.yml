name: Testes e2e

# A suíte de ponta a ponta (packages/e2e). Desde 2026-11-06 roda depois do merge, em cada push na main que mude o app
# ou o próprio teste, e não segura o PR (ADR-0006): vermelho na main vira o primeiro item da próxima volta, e nenhuma
# release sai dele. Num PR continua sob demanda, para uma mudança arriscada: o rótulo `e2e-tests` roda a suíte e grava
# o status "testes e2e" no commit, só para informar (não é mais exigido para o merge); o rótulo sai depois da rodada.

on:
  push:
    branches: [main]
    # mantenha igual aos CAMINHOS de scripts/e2e-main.sh, que a trava da release usa
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'packages/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/e2e.yml'
  pull_request:
    types: [labeled]

# Na main só importa o commit mais novo: um merge novo cancela a rodada do anterior. No PR, uma rodada por vez.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  e2e:
    if: github.event_name == 'push' || github.event.label.name == 'e2e-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTEXT: testes e2e
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Marca como rodando
        if: github.event_name == 'pull_request'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context="$CONTEXT" -f description="Rodando" -f target_url="$RUN_URL"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build igual ao do GitHub Pages
        run: pnpm build
        env:
          BASE_PATH: /lerolero
      # o mesmo app com os textos na pseudolíngua, para o teste de textos fixos (textos.spec.ts, ADR-0008)
      - name: Build da pseudolíngua
        run: pnpm --filter @lerolero/app build:pseudo
      # Chrome que já vem no ubuntu-latest, com relays e Blossom locais (packages/e2e/servidores.ts)
      - name: Suíte de ponta a ponta
        working-directory: packages/e2e
        run: pnpm e2e
      - name: Guarda capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: packages/e2e/resultados/
          retention-days: 7

      - name: Grava o resultado no PR
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ "${{ job.status }}" = success ]; then state=success; desc="Passou"; else state=failure; desc="Falhou"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state \
            -f context="$CONTEXT" -f description="$desc" -f target_url="$RUN_URL"
      - name: Tira o rótulo
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --remove-label e2e-tests

      # Vermelho na main: a issue guarda o item sem depender de ninguém lembrar. O GitHub avisa o Pedro, e o
      # situacao.sh, o pr.sh e a trava da release (scripts/e2e-main.sh) a leem. Uma issue aberta por vez; cada falha
      # seguinte comenta nela.
      - name: Abre a issue e2e-main
        if: failure() && github.event_name == 'push'
        run: |
          gh label create e2e-main -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "E2E vermelho na main (ADR-0006)" 2>/dev/null || true
          aberta=$(gh issue list -R "$GITHUB_REPOSITORY" --label e2e-main --state open --json number --jq '.[0].number // empty')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" -R "$GITHUB_REPOSITORY" --body "Ainda vermelho em ${GITHUB_SHA:0:7}: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label e2e-main --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "E2E vermelho na main (${GITHUB_SHA:0:7})" \
              --body "O e2e falhou na \`main\` em ${GITHUB_SHA:0:7}: $RUN_URL

          É o primeiro item da próxima volta, antes do roadmap, e nenhuma release sai enquanto esta issue estiver aberta
          (ADR-0006). Se for um teste instável, rode de novo a rodada. Ela fecha sozinha quando o e2e da \`main\` voltar
          a verde: não feche à mão."
          fi
      - name: Fecha a issue e2e-main
        if: success() && github.event_name == 'push'
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label e2e-main --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Verde de novo em ${GITHUB_SHA:0:7}: $RUN_URL"
          done

name: Android

# APK de teste do app nativo (item 27, ADR-0011): a interface embutida, com os servidores da homologação, num APK de
# depuração que instala ao lado do de verdade ("Lero homolog."). Sai como artefato da rodada, para baixar e instalar
# no celular. Não é checagem obrigatória: só roda quando muda o que vai dentro do APK.

on:
  pull_request:
    paths: [packages/android/**, packages/app/**, packages/core/**, pnpm-lock.yaml, .github/workflows/android.yml]
  push:
    branches: [main]
    paths: [packages/android/**, packages/app/**, packages/core/**, pnpm-lock.yaml, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Interface e APK de teste
        working-directory: packages/android
        run: APP_RELEASE="homolog-${GITHUB_SHA::7}" pnpm apk
        env:
          APP_AMBIENTE: homologacao
      # o APK assinado só sai na release; aqui ele é montado com uma chave descartável, para um erro na assinatura ou na
      # versão aparecer no PR e não na hora da release
      - name: APK da release, com chave descartável
        working-directory: packages/android/android
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/teste.p12" -storepass "$APK_CHAVE_SENHA" \
            -alias lerolero -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=teste' >/dev/null
          APK_CHAVE="$RUNNER_TEMP/teste.p12" ./gradlew assembleRelease
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$aapt" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk.txt"
          grep '^package:' "$RUNNER_TEMP/apk.txt"
          grep -q "versionCode='17000' versionName='0.17.0'" "$RUNNER_TEMP/apk.txt"
        env:
          APP_RELEASE: 0.17.0
          APK_CHAVE_SENHA: descartavel
      - uses: actions/upload-artifact@v4
        with:
          name: lerolero-homologacao-${{ github.sha }}
          path: packages/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

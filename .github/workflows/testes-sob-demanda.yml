name: Testes sob demanda

# Testes lentos ou que dependem da rede real rodam só quando pedidos, com um rótulo no PR:
# `integration-tests` (relays e Blossom de verdade) ou `e2e-tests` (suíte de ponta a ponta).
# O resultado vira um status no commit ("testes de integração", "testes e2e"), que a regra da
# main exige para o merge. Um commit novo deixa o status pendente outra vez, e o rótulo sai
# depois de cada rodada: para testar de novo, ponha o rótulo de novo.
#
# O resultado é um status gravado pela API, e não o próprio job, porque um job pulado conta como
# aprovado para as checagens obrigatórias do GitHub.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  pendente:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # PR só de documentação (docs/ ou arquivos .md) não precisa dos testes lentos
      # com a fila do Actions lenta, este job pode rodar depois da rodada pedida pelo rótulo; não
      # sobrescreve o resultado dela
      - name: Marca o status do commit
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --name-only \
              | grep -qvE '^docs/|\.md$'; then
            state=pending; docs=false
          else
            state=success; docs=true
          fi
          for context in "testes de integração" "testes e2e"; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
                --jq "[.[] | select(.context == \"$context\")] | length")" != 0 ]; then
              echo "o commit já tem status de $context"; continue
            fi
            label=$([ "$context" = "testes e2e" ] && echo e2e-tests || echo integration-tests)
            desc=$([ $docs = true ] && echo "Só documentação: dispensado" || echo "Ponha o rótulo $label para rodar")
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state -f context="$context" -f description="$desc"
          done

  integracao:
    if: github.event.action == 'labeled' && github.event.label.name == 'integration-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CONTEXT: testes de integração
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Marca como rodando
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context="$CONTEXT" -f description="Rodando" -f target_url="$RUN_URL"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Relays e Blossom reais
        working-directory: packages/core
        run: pnpm test:rede
      - name: Grava o resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then state=success; desc="Passou"; else state=failure; desc="Falhou"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state \
            -f context="$CONTEXT" -f description="$desc" -f target_url="$RUN_URL"
      - name: Tira o rótulo
        if: always()
        run: gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --remove-label integration-tests

  e2e:
    if: github.event.action == 'labeled' && github.event.label.name == 'e2e-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CONTEXT: testes e2e
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Marca como rodando
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context="$CONTEXT" -f description="Rodando" -f target_url="$RUN_URL"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build igual ao do GitHub Pages
        run: pnpm build
        env:
          BASE_PATH: /lerolero
      # Chrome que já vem no ubuntu-latest, com relays e Blossom locais (packages/e2e/servidores.ts)
      - name: Suíte de ponta a ponta
        working-directory: packages/e2e
        run: pnpm e2e
      - name: Guarda capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: packages/e2e/resultados/
          retention-days: 7
      - name: Grava o resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then state=success; desc="Passou"; else state=failure; desc="Falhou"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state \
            -f context="$CONTEXT" -f description="$desc" -f target_url="$RUN_URL"
      - name: Tira o rótulo
        if: always()
        run: gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --remove-label e2e-tests

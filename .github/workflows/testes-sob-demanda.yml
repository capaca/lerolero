name: Testes sob demanda

# Testes que dependem da rede real rodam só quando pedidos, com o rótulo `integration-tests` no PR (relays e Blossom
# de verdade). O resultado vira o status "testes de integração" no commit, que a regra da main exige para o merge. Um
# commit novo deixa o status pendente outra vez, e o rótulo sai depois de cada rodada: para testar de novo, ponha o
# rótulo de novo. A suíte e2e saiu daqui em 2026-11-06: roda depois do merge, no e2e.yml (ADR-0006).
#
# O resultado é um status gravado pela API, e não o próprio job, porque um job pulado conta como
# aprovado para as checagens obrigatórias do GitHub.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  pendente:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # PR só de documentação ou de bastidores (docs/, arquivos .md, scripts/ e .claude/ da raiz, que não entram no
      # app nem nos testes) não precisa dos testes lentos
      # com a fila do Actions lenta, este job pode rodar depois da rodada pedida pelo rótulo; não
      # sobrescreve o resultado dela
      - name: Marca o status do commit
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --name-only \
              | grep -qvE '^docs/|^scripts/|^\.claude/|\.md$'; then
            state=pending; docs=false
          else
            state=success; docs=true
          fi
          context="testes de integração"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq "[.[] | select(.context == \"$context\")] | length")" != 0 ]; then
            echo "o commit já tem status de $context"; exit 0
          fi
          desc=$([ $docs = true ] && echo "Só documentação ou bastidores: dispensado" || echo "Ponha o rótulo integration-tests para rodar")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state -f context="$context" -f description="$desc"

  integracao:
    if: github.event.action == 'labeled' && github.event.label.name == 'integration-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CONTEXT: testes de integração
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Marca como rodando
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context="$CONTEXT" -f description="Rodando" -f target_url="$RUN_URL"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Relays e Blossom reais
        working-directory: packages/core
        run: pnpm test:rede
      - name: Grava o resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then state=success; desc="Passou"; else state=failure; desc="Falhou"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state \
            -f context="$CONTEXT" -f description="$desc" -f target_url="$RUN_URL"
      - name: Tira o rótulo
        if: always()
        run: gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --remove-label integration-tests


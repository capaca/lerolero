name: Release

# Única forma de pôr o app no ar. Disparo manual no Actions (ou `gh workflow run release.yml -f tipo=minor`):
# calcula a versão a partir da última tag (SemVer 0.x até o beta), verifica, monta o site, publica no
# GitHub Pages e só então cria a tag e a Release com as notas geradas dos PRs.

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'minor = funcionalidade nova; patch = só correção'
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

# uma release por vez: deploys seguidos já deram tela branca pelo cache do Pages
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  montar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # as tags dizem qual foi a última versão
      - name: Calcula a versão
        id: versao
        run: |
          ultima=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${ultima#v}"
          case "${{ inputs.tipo }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          versao="$major.$minor.$patch"
          echo "última: $ultima → nova: v$versao"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build do app
        run: pnpm build
        env:
          BASE_PATH: /lerolero
          APP_RELEASE: ${{ steps.versao.outputs.versao }}
      # o protótipo fica fora do workspace (npm); o cache evita baixar tudo a cada execução,
      # e o fetch-timeout curto faz um download travado ser repetido em 30 s, não em 5 min
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-medicao-${{ hashFiles('prototipos/medicao/package-lock.json') }}
      - name: Build do protótipo de medição
        working-directory: prototipos/medicao
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=30000 && npm run build
      # o app ocupa a raiz do site; o protótipo fica em /medicao/
      - name: Monta o site
        run: |
          cp -rL packages/app/build site
          cp -r prototipos/medicao/dist site/medicao
      # Mantém no ar o código da versão publicada até agora. Logo depois de publicar, páginas
      # antigas guardadas (no navegador, na CDN do GitHub ou no service worker) ainda pedem os
      # arquivos da versão anterior; sem isto eles somem e o app abre em branco. Os arquivos
      # têm o hash no nome, então as duas versões convivem sem conflito.
      - name: Preserva o código da versão anterior
        run: |
          base=https://capaca.github.io/lerolero
          curl -sf "$base/service-worker.js" | grep -o '_app/immutable/[^"`]*' | sort -u > anteriores.txt || true
          kept=0
          while read -r f; do
            if [ ! -f "site/$f" ] && curl -sf --create-dirs -o "site/$f" "$base/$f"; then kept=$((kept+1)); fi
          done < anteriores.txt
          echo "arquivos da versão anterior mantidos: $kept"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  registrar:
    needs: [montar, publicar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ needs.montar.outputs.versao }}
    steps:
      - name: Cria a tag e a Release
        run: |
          gh release create "v$VERSAO" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Lero-lero $VERSAO" --generate-notes

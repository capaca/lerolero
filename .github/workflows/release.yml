name: Release

# Única forma de pôr o app no ar. Disparo manual no Actions (ou `gh workflow run release.yml -f tipo=minor`):
# pega o commit que está na homologação (ADR-0007: o que o Pedro conferiu, não o que estiver na main), calcula a
# versão a partir da última tag (SemVer 0.x até o beta), verifica, monta o site e o APK assinado, publica no GitHub
# Pages e só então cria a tag e a Release com as notas geradas dos PRs e o APK.

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'minor = funcionalidade nova; patch = só correção'
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

# uma release por vez: deploys seguidos já deram tela branca pelo cache do Pages
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  montar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # o e2e da main
      issues: read # a issue e2e-main
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      commit: ${{ steps.validado.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # as tags dizem qual foi a última versão
      - name: Pega o commit validado na homologação
        id: validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api repos/lerolero-app/lerolero/contents/commit.txt?ref=gh-pages --jq .content | base64 -d | tr -d '[:space:]')
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$commit (homologação) não está na main"; exit 1; }
          # Nenhuma release sai de uma main vermelha (ADR-0006, 2026-11-06), também para quem dispara pela página do
          # Actions sem o release.sh. Roda com o script da main, antes de trocar para o commit da homologação.
          if ! motivo=$(scripts/e2e-main.sh trava "$commit"); then echo "::error::Sem release: $motivo (ADR-0006)"; exit 1; fi
          git checkout -q "$commit"
          echo "publicando o commit da homologação: $(git log -1 --format='%h %s')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Calcula a versão
        id: versao
        run: |
          ultima=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${ultima#v}"
          case "${{ inputs.tipo }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          versao="$major.$minor.$patch"
          echo "última: $ultima → nova: v$versao"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build do app
        run: pnpm build
        env:
          BASE_PATH: /lerolero
          APP_RELEASE: ${{ steps.versao.outputs.versao }}
      # P7: só o app na origem da produção. Os protótipos (outras dependências, `npm ci` com scripts de instalação)
      # ficam na homologação: código comprometido ali rodaria na mesma origem da conta de verdade
      - name: Monta o site
        run: cp -rL packages/app/build site
      # Mantém no ar o código da versão publicada até agora. Logo depois de publicar, páginas
      # antigas guardadas (no navegador, na CDN do GitHub ou no service worker) ainda pedem os
      # arquivos da versão anterior; sem isto eles somem e o app abre em branco. Os arquivos
      # têm o hash no nome, então as duas versões convivem sem conflito.
      - name: Preserva o código da versão anterior
        run: |
          base=https://capaca.github.io/lerolero
          curl -sf "$base/service-worker.js" | grep -o '_app/immutable/[^"`]*' | sort -u > anteriores.txt || true
          kept=0
          while read -r f; do
            if [ ! -f "site/$f" ] && curl -sf --create-dirs -o "site/$f" "$base/$f"; then kept=$((kept+1)); fi
          done < anteriores.txt
          echo "arquivos da versão anterior mantidos: $kept"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # O APK assinado da mesma versão (ADR-0011), anexado à Release. Vem antes de publicar: APK quebrado barra a release
  # inteira, em vez de deixar o site numa versão e o app Android sem ela. A chave fica no ambiente `apk`, que só a
  # main usa (packages/android/scripts/chave.sh).
  apk:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apk
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.montar.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Interface e APK assinado
        working-directory: packages/android
        run: |
          [ -n "$CHAVE" ] || { echo "::error::Falta a chave do APK no ambiente apk: rode packages/android/scripts/chave.sh"; exit 1; }
          printf %s "$CHAVE" | base64 -d > "$RUNNER_TEMP/chave.p12"
          APK_CHAVE="$RUNNER_TEMP/chave.p12" pnpm apk:release
          mv android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lerolero.apk"
          rm "$RUNNER_TEMP/chave.p12"
        env:
          APP_RELEASE: ${{ needs.montar.outputs.versao }}
          CHAVE: ${{ secrets.APK_CHAVE_BASE64 }}
          APK_CHAVE_SENHA: ${{ secrets.APK_CHAVE_SENHA }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/lerolero.apk
          retention-days: 7

  publicar:
    needs: [montar, apk]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # o repassador de push (ADR-0010) do mesmo commit, no Cloudflare Workers da produção
  repassador:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.montar.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @lerolero/repassador
      - name: Publica na produção
        working-directory: packages/repassador
        # Espaço ou quebra de linha colados com um secret entram na URL da API (já aconteceu com o HOMOLOG_TOKEN). No
        # primeiro deploy (2026-11-04) o wrangler não achou o subdomínio workers.dev da conta; não eram espaços (o aviso
        # não apareceu) e a nova tentativa passou sem mudar os secrets. Se voltar, rode com WRANGLER_LOG=debug.
        run: |
          conta=$(printf %s "$CONTA" | tr -d '[:space:]')
          token=$(printf %s "$TOKEN" | tr -d '[:space:]')
          [ "${#conta}" = "${#CONTA}" ] || echo "::warning::O secret CLOUDFLARE_ACCOUNT_ID tinha espaços ou quebras de linha"
          [ "${#token}" = "${#TOKEN}" ] || echo "::warning::O secret CLOUDFLARE_API_TOKEN tinha espaços ou quebras de linha"
          [[ "$conta" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::O secret CLOUDFLARE_ACCOUNT_ID não parece um Account ID (32 caracteres hexadecimais)"; exit 1; }
          CLOUDFLARE_ACCOUNT_ID=$conta CLOUDFLARE_API_TOKEN=$token pnpm deploy:producao
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  registrar:
    needs: [montar, publicar, repassador]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ needs.montar.outputs.versao }}
      COMMIT: ${{ needs.montar.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      # o APK com nome fixo: o aviso no app e o Obtainium acham sempre o mesmo arquivo na última Release
      - name: Cria a tag e a Release, com o APK
        run: |
          gh release create "v$VERSAO" -R "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "Lero-lero $VERSAO" --generate-notes lerolero.apk

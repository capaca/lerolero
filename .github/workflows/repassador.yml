name: Repassador de push

# Publica o repassador de Web Push (ADR-0010, packages/repassador) no Cloudflare Workers da homologação a cada merge
# que muda a pasta. A produção sai só na release (release.yml), com o commit validado na homologação.
# Secrets: CLOUDFLARE_API_TOKEN ("lerolero-repassador-ci": Workers Scripts Read e Write na conta, vence em 2027-11-04,
# com aviso no situacao.sh e na agenda do Pedro) e CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ['packages/repassador/**', 'pnpm-lock.yaml', '.github/workflows/repassador.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repassador-homologacao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @lerolero/repassador
      - name: Publica na homologação
        working-directory: packages/repassador
        # Espaço ou quebra de linha colados com o secret entram na URL da API. Suspeita do primeiro deploy (2026-11-04),
        # em que o wrangler não achou o subdomínio workers.dev que a conta tem; já aconteceu com o HOMOLOG_TOKEN.
        run: |
          conta=$(printf %s "$CONTA" | tr -d '[:space:]')
          token=$(printf %s "$TOKEN" | tr -d '[:space:]')
          [ "${#conta}" = "${#CONTA}" ] || echo "::warning::O secret CLOUDFLARE_ACCOUNT_ID tinha espaços ou quebras de linha"
          [ "${#token}" = "${#TOKEN}" ] || echo "::warning::O secret CLOUDFLARE_API_TOKEN tinha espaços ou quebras de linha"
          [[ "$conta" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::O secret CLOUDFLARE_ACCOUNT_ID não parece um Account ID (32 caracteres hexadecimais)"; exit 1; }
          CLOUDFLARE_ACCOUNT_ID=$conta CLOUDFLARE_API_TOKEN=$token pnpm deploy:homologacao
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

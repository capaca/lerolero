name: CI

# Roda a cada commit de PR e na main: tipos, testes unitários e build. Não publica: o deploy sai só na release
# (release.yml), e os testes com a rede real rodam por rótulo no PR (testes-sob-demanda.yml).
# Mudança só de documentação (docs/ ou arquivos .md) pula os passos, mas o job roda e termina
# verde: se o workflow inteiro fosse pulado, a checagem obrigatória ficaria esperando para sempre.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # para comparar com a base do PR ou com o push anterior
      - name: Só documentação?
        id: docs
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=${{ github.event.pull_request.base.sha }}
          elif [ "$GITHUB_EVENT_NAME" = push ]; then base=${{ github.event.before }}
          else base=; fi
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null \
              && ! git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "Só documentação: pulando tipos, testes e build"
            echo "so=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4 # versão do pnpm vem do campo packageManager
        if: steps.docs.outputs.so != 'true'
      - uses: actions/setup-node@v5
        if: steps.docs.outputs.so != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.docs.outputs.so != 'true'
      - name: Tipos
        if: steps.docs.outputs.so != 'true'
        run: pnpm check
      - name: Testes
        if: steps.docs.outputs.so != 'true'
        run: pnpm test
      - name: Build do app
        if: steps.docs.outputs.so != 'true'
        run: pnpm build
        env:
          BASE_PATH: /lerolero

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototipos/medicao/package-lock.json
      - name: Protótipo de medição
        working-directory: prototipos/medicao
        run: npm ci && npm run build
      # O app vai ocupar a raiz do site; o protótipo fica em /medicao/
      - name: Monta o site
        run: |
          mkdir -p site
          cp -r prototipos/medicao/dist site/medicao
          echo '<meta http-equiv="refresh" content="0; url=medicao/">' > site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
